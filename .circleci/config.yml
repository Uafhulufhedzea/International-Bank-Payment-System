version: 2.1

# Define specialized pipeline executors
executors:
  node-executor:
    docker:
      - image: cimg/node:20.11.0 # Secure, verified CircleCI Node image base
    working_directory: ~/repo

jobs:
  build_and_test:
    executor: node-executor
    steps:
      - checkout # Pull source code from GitHub repository

      # Restore dependency cache to optimize pipeline execution speed
      - restore_cache:
          keys:
            - v1-backend-deps-{{ checksum "backend/package.json" }}
            - v1-backend-deps-

      - run:
          name: Install Backend Dependencies
          command: cd backend && npm install

      - save_cache:
          paths:
            - backend/node_modules
          key: v1-backend-deps-{{ checksum "backend/package.json" }}

      # SOFTWARE COMPOSITION ANALYSIS (SCA)
      # Scans third-party packages for hidden risks.
      - run:
          name: Run Software Composition Analysis (SCA Dependency Audit)
          command: cd backend && npm audit --audit-level=high || true

      # API INTEGRITY & APPLICATION VALIDATION
      # Checks server routes for syntax errors before deployment.
      - run:
          name: Validate Backend Code Integrity & Syntax Check
          command: node --check backend/server.js

      # STATIC APPLICATION SECURITY TESTING (SAST) - SONARQUBE
      # Analyzes source code for bugs, security hotspots, and code smells.
      - run:
          name: Run Automated SonarQube Security Scan
          command: |
            if [ -z "$SONAR_TOKEN" ]; then
              echo "SONAR_TOKEN not configured. Skipping SonarQube scan."
              echo "To enable: add SONAR_TOKEN in CircleCI Project Settings > Environment Variables."
              exit 0
            fi
            npx sonar-scanner \
              -Dsonar.projectKey=international-bank-payment-system \
              -Dsonar.projectName="International Bank Payment System" \
              -Dsonar.sources=backend,src \
              -Dsonar.exclusions=**/node_modules/**,**/key.pem,**/cert.pem \
              -Dsonar.host.url=${SONAR_HOST_URL:-"https://sonarcloud.io"} \
              -Dsonar.login=${SONAR_TOKEN}

workflows:
  version: 2
  security_and_deployment_pipeline:
    jobs:
      - build_and_test:
          filters:
            branches:
              only:
                - main
